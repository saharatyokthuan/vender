<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Vending Stock Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080808;--bg-panel:#0f0f0f;--bg-card:#141414;--red:#ff1a1a;--red-glow:#ff000055;--red-dim:#3a0000;--red-hot:#ff4444;--amber:#ffaa00;--green:#00ff88;--text:#f0f0f0;--muted:#444;--font-d:'Orbitron',monospace;--font-m:'Share Tech Mono',monospace}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-m);color:var(--text);background-image:linear-gradient(#1a00001a 1px,transparent 1px),linear-gradient(90deg,#1a00001a 1px,transparent 1px);background-size:32px 32px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px)}
.screen{display:none;flex-direction:column;height:100dvh;max-width:420px;margin:0 auto}
.screen.active{display:flex}
.hdr{padding:16px;text-align:center;border-bottom:1px solid var(--red-dim);background:linear-gradient(180deg,rgba(80,0,0,.2) 0%,transparent 100%);position:relative;flex-shrink:0}
.hdr::after{content:'';position:absolute;bottom:-2px;left:10%;width:80%;height:2px;background:var(--red);box-shadow:0 0 12px 3px var(--red);border-radius:2px}
.hdr-eye{font-size:9px;letter-spacing:4px;color:var(--muted);margin-bottom:4px}
.hdr-title{font-family:var(--font-d);font-size:clamp(15px,4.5vw,19px);font-weight:900;letter-spacing:2px;text-shadow:0 0 8px var(--red),0 0 24px rgba(255,26,26,.3)}
.hdr-title span{color:var(--red);text-shadow:0 0 12px var(--red),0 0 40px rgba(255,26,26,.5)}
.hdr-sub{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hdr-status{font-size:9px;color:var(--green);letter-spacing:2px}
.alert-badge{position:absolute;top:12px;right:12px;background:var(--red);color:#fff;font-family:var(--font-d);font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;cursor:pointer;box-shadow:0 0 10px var(--red);display:none}
.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.body::-webkit-scrollbar{width:3px}
.body::-webkit-scrollbar-thumb{background:var(--red-dim)}
.sec-lbl{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--red-dim),transparent)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-btn{background:var(--bg-card);border:1px solid var(--red-dim);border-radius:4px;padding:16px 8px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;outline:none;transition:border-color .15s,box-shadow .15s,transform .1s;width:100%}
.cat-btn::before,.cat-btn::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--red-dim);border-style:solid;transition:border-color .15s}
.cat-btn::before{top:5px;left:5px;border-width:1px 0 0 1px}
.cat-btn::after{bottom:5px;right:5px;border-width:0 1px 1px 0}
.cat-btn:active{transform:scale(.97);border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 16px 2px var(--red-glow),inset 0 0 20px rgba(255,26,26,.1)}
.cat-icon{font-size:30px;filter:drop-shadow(0 0 5px rgba(255,60,60,.4))}
.cat-name{font-family:var(--font-d);font-size:10px;font-weight:700;letter-spacing:1px;text-align:center}
.cat-count{font-size:10px;color:var(--muted)}
.cat-warn{font-size:9px;color:var(--amber);letter-spacing:1px}
.alert-panel{background:var(--bg-card);border:1px solid var(--amber);border-radius:4px;padding:12px;display:none;flex-direction:column;gap:8px}
.alert-panel.open{display:flex}
.alert-title{font-family:var(--font-d);font-size:10px;color:var(--amber);letter-spacing:2px;text-shadow:0 0 8px var(--amber)}
.alert-item{font-size:11px;padding:6px 8px;border-left:2px solid var(--amber);background:rgba(255,170,0,.05);display:flex;justify-content:space-between;align-items:center}
.alert-item.expired{border-color:var(--red);background:rgba(255,26,26,.05)}
.alert-item.expired .a-tag{color:var(--red)}
.a-tag{font-size:9px;color:var(--amber);letter-spacing:1px}
.bot{padding:12px 16px 20px;border-top:1px solid var(--red-dim);background:linear-gradient(0deg,rgba(80,0,0,.12) 0%,transparent 100%);flex-shrink:0}
.sum-btn{width:100%;padding:16px;background:transparent;border:1px solid var(--red);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 12px 1px rgba(255,26,26,.25),inset 0 0 20px rgba(255,26,26,.03);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;outline:none;transition:transform .1s,box-shadow .15s}
.sum-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,26,26,.07),transparent);transform:translateX(-100%);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}60%{transform:translateX(100%)}100%{transform:translateX(100%)}}
.sum-btn:active{transform:scale(.985);box-shadow:0 0 0 1px var(--red),0 0 28px 6px rgba(255,26,26,.45),inset 0 0 30px rgba(255,26,26,.12)}
.sum-ico{font-size:20px;position:relative;z-index:1;filter:drop-shadow(0 0 6px var(--red))}
.sum-txt{font-family:var(--font-d);font-size:14px;font-weight:700;letter-spacing:3px;color:var(--red);text-shadow:0 0 10px var(--red),0 0 30px rgba(255,26,26,.4);position:relative;z-index:1}
.back-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--red);font-family:var(--font-m);font-size:12px;letter-spacing:1px;cursor:pointer;padding:12px 16px 0;-webkit-tap-highlight-color:transparent}
.prod-list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.prod-list::-webkit-scrollbar{width:3px}
.prod-list::-webkit-scrollbar-thumb{background:var(--red-dim)}
.prod-card{background:var(--bg-card);border:1px solid var(--red-dim);border-radius:4px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.prod-card.low{border-color:var(--amber);box-shadow:0 0 8px rgba(255,170,0,.2)}
.prod-card.expired{border-color:var(--red);box-shadow:0 0 8px rgba(255,26,26,.2)}
.prod-name{font-size:12px;font-weight:bold;grid-column:1}
.prod-meta{font-size:10px;color:var(--muted);grid-column:1}
.prod-exp{font-size:9px}
.prod-exp.ok{color:var(--green)}
.prod-exp.warn{color:var(--amber)}
.prod-exp.bad{color:var(--red)}
.stock-ctrl{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:4px}
.stock-num{font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--text);min-width:36px;text-align:center}
.stock-num.low{color:var(--amber);text-shadow:0 0 10px var(--amber)}
.stock-num.critical{color:var(--red);text-shadow:0 0 10px var(--red)}
.s-btn{width:32px;height:32px;border-radius:3px;border:1px solid var(--red-dim);background:var(--bg-panel);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.s-btn:active{border-color:var(--red);box-shadow:0 0 10px var(--red-glow);transform:scale(.92)}
.add-prod-btn{width:100%;padding:12px;background:transparent;border:1px dashed var(--red-dim);border-radius:4px;color:var(--muted);font-family:var(--font-m);font-size:11px;letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.add-prod-btn:active{border-color:var(--red);color:var(--red)}
.sum-content{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.sum-card{background:var(--bg-card);border:1px solid var(--red-dim);border-radius:4px;padding:14px}
.sum-cat{font-family:var(--font-d);font-size:11px;color:var(--red);letter-spacing:1px;margin-bottom:8px;text-shadow:0 0 8px var(--red)}
.sum-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #1a1a1a}
.sum-row:last-child{border:none}
.sum-row.total-row{font-family:var(--font-d);font-size:13px;margin-top:6px;padding-top:8px;border-top:1px solid var(--red-dim)!important;border-bottom:none}
.sum-total-box{background:var(--bg-card);border:1px solid var(--red);border-radius:4px;padding:16px;text-align:center;box-shadow:0 0 16px rgba(255,26,26,.2)}
.sum-total-lbl{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
.sum-total-num{font-family:var(--font-d);font-size:28px;font-weight:900;color:var(--red);text-shadow:0 0 16px var(--red),0 0 40px rgba(255,26,26,.4)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--bg-panel);border:1px solid var(--red);border-radius:4px;padding:20px;width:100%;max-width:340px;box-shadow:0 0 30px rgba(255,26,26,.3)}
.modal-title{font-family:var(--font-d);font-size:12px;color:var(--red);letter-spacing:2px;margin-bottom:16px;text-shadow:0 0 8px var(--red)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:10px;letter-spacing:2px;color:var(--muted)}
.field input{background:var(--bg-card);border:1px solid var(--red-dim);border-radius:3px;color:var(--text);font-family:var(--font-m);font-size:13px;padding:8px 10px;outline:none;width:100%}
.field input:focus{border-color:var(--red);box-shadow:0 0 8px var(--red-glow)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.m-btn{flex:1;padding:10px;border-radius:3px;font-family:var(--font-d);font-size:11px;letter-spacing:1px;cursor:pointer;border:1px solid var(--red-dim);background:transparent;color:var(--muted);-webkit-tap-highlight-color:transparent}
.m-btn.primary{border-color:var(--red);color:var(--red);box-shadow:0 0 8px var(--red-glow)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg-card);border:1px solid var(--red);border-radius:4px;padding:8px 18px;font-size:11px;letter-spacing:1px;color:var(--red);box-shadow:0 0 14px rgba(255,26,26,.4);opacity:0;transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:24px;font-size:11px;color:var(--muted);letter-spacing:2px}
.io-row{display:flex;gap:8px;padding:0 16px 10px}
.io-btn{flex:1;padding:8px;background:transparent;border:1px solid var(--red-dim);border-radius:3px;color:var(--muted);font-family:var(--font-m);font-size:10px;letter-spacing:1px;cursor:pointer}
.io-btn:active{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="screen active" id="screen-home">
  <header class="hdr">
    <div class="hdr-eye">OFFLINE MODE // POS-2087</div>
    <div class="hdr-title">VENDING <span>STOCK</span> MANAGER</div>
    <div class="hdr-sub"><div class="dot"></div><span class="hdr-status" id="hdr-status">CONNECTED</span></div>
    <div class="alert-badge" id="alert-badge" onclick="toggleAlerts()">⚠ <span id="alert-count">0</span></div>
  </header>
  <div class="body">
    <div class="alert-panel" id="alert-panel">
      <div class="alert-title">⚠ แจ้งเตือน</div>
      <div id="alert-list"><div class="loading">กำลังโหลด...</div></div>
    </div>
    <div class="sec-lbl">หมวดหมู่สินค้า</div>
    <div class="cat-grid" id="cat-grid"><div class="loading" style="grid-column:1/-1">กำลังโหลด...</div></div>
  </div>
  <div class="io-row">
    <button class="io-btn" onclick="exportData()">⭳ สำรองข้อมูล (JSON)</button>
    <button class="io-btn" onclick="document.getElementById('import-file').click()">⭱ นำเข้าข้อมูล</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"/>
  </div>
  <div class="bot">
    <button class="sum-btn" onclick="goSummary()">
      <span class="sum-ico">⬡</span><span class="sum-txt">สรุปยอด</span>
    </button>
  </div>
</div>
<div class="screen" id="screen-products">
  <header class="hdr">
    <div class="hdr-eye" id="prod-eyebrow">หมวดหมู่</div>
    <div class="hdr-title" id="prod-title">สินค้า</div>
  </header>
  <button class="back-btn" onclick="goHome()">← กลับ</button>
  <div class="prod-list" id="prod-list"><div class="loading">กำลังโหลด...</div></div>
  <div class="bot"><button class="add-prod-btn" onclick="openAddModal()">+ เพิ่มสินค้า</button></div>
</div>
<div class="screen" id="screen-summary">
  <header class="hdr">
    <div class="hdr-eye">STOCK REPORT</div>
    <div class="hdr-title">สรุปยอด<span>สต๊อก</span></div>
  </header>
  <button class="back-btn" onclick="goHome()">← กลับ</button>
  <div class="sum-content" id="sum-content"><div class="loading">กำลังโหลด...</div></div>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">เพิ่มสินค้า</div>
    <div class="field"><label>ชื่อสินค้า</label><input id="f-name" type="text"/></div>
    <div class="field"><label>จำนวนสต๊อก</label><input id="f-stock" type="number" min="0"/></div>
    <div class="field"><label>แจ้งเตือนเมื่อเหลือ (ชิ้น)</label><input id="f-min" type="number" min="1"/></div>
    <div class="field"><label>วันหมดอายุ</label><input id="f-exp" type="date"/></div>
    <div class="field"><label>ราคา (บาท)</label><input id="f-price" type="number" min="0" step="0.5"/></div>
    <div class="modal-actions">
      <button class="m-btn" onclick="closeModal()">ยกเลิก</button>
      <button class="m-btn primary" onclick="saveProduct()">บันทึก</button>
    </div>
    <div class="modal-actions" id="delete-row" style="display:none">
      <button class="m-btn" style="border-color:var(--red);color:var(--red)" onclick="deleteProduct()">🗑 ลบสินค้านี้</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===== OFFLINE DATA LAYER (no network calls) ===== */
const STORAGE_KEY = 'vending_stock_data_v1';
let hasPersistence = false;

let categories = [
  {id:1,name:'เครื่องดื่ม',icon:'🥤'},
  {id:2,name:'ขนม',icon:'🍪'},
  {id:3,name:'บะหมี่กึ่งสำเร็จรูป',icon:'🍜'},
  {id:4,name:'ของใช้',icon:'🧴'}
];
let products = [
  {id:1,category_id:1,name:'น้ำเปล่า 600ml',stock:24,min_stock:6,expiry_date:'2026-12-01',price:7},
  {id:2,category_id:1,name:'ชาเขียวโออิชิ',stock:5,min_stock:6,expiry_date:'2026-08-20',price:20},
  {id:3,category_id:2,name:'เลย์รสดั้งเดิม',stock:12,min_stock:5,expiry_date:'2026-09-15',price:20},
  {id:4,category_id:3,name:'มาม่าต้มยำกุ้ง',stock:2,min_stock:5,expiry_date:'2026-07-20',price:8},
  {id:5,category_id:4,name:'ทิชชู่เปียก',stock:8,min_stock:3,expiry_date:null,price:15}
];
let currentCatId=null,currentCatName='',editingProdId=null;

function nextId(list){ return list.length ? Math.max(...list.map(x=>x.id))+1 : 1; }

async function loadData(){
  try{
    const r = await window.storage.get(STORAGE_KEY);
    if(r && r.value){
      const d = JSON.parse(r.value);
      if(d.categories) categories = d.categories;
      if(d.products) products = d.products;
    }
    hasPersistence = true;
    document.getElementById('hdr-status').textContent = 'OFFLINE • บันทึกอัตโนมัติ';
  }catch(e){
    // No persistent storage available (e.g. opened as a plain file) — runs in-memory only for this session
    hasPersistence = false;
    document.getElementById('hdr-status').textContent = 'OFFLINE • ข้อมูลชั่วคราว';
  }
}
async function saveData(){
  if(!hasPersistence) return;
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({categories,products}));
  }catch(e){ /* silently ignore — data still lives in memory for this session */ }
}

function decorateProduct(p){
  const today = new Date().toISOString().slice(0,10);
  return {...p, is_expired: !!(p.expiry_date && p.expiry_date < today), is_low: p.stock <= p.min_stock};
}
function getCategoriesStats(){
  return categories.map(c=>{
    const cp = products.filter(p=>p.category_id===c.id).map(decorateProduct);
    return {...c, total: cp.length, low_stock: cp.filter(p=>p.is_low).length};
  });
}
function getProducts(catId){
  let list = catId==null ? products : products.filter(p=>p.category_id===catId);
  return list.map(decorateProduct);
}
function getAlerts(){
  const d = products.map(decorateProduct);
  return { low_stock: d.filter(p=>p.is_low && !p.is_expired), expiring: d.filter(p=>p.is_expired) };
}

/* ===== UI (unchanged behavior, now backed by local data) ===== */
let _tt;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2000)}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

async function goHome(){showScreen('screen-home');loadCategories();loadAlerts()}

function loadCategories(){
  const cats = getCategoriesStats();
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = cats.map(c=>`<button class="cat-btn" onclick="goProducts(${c.id},'${c.name}','${c.icon}')"><span class="cat-icon">${c.icon}</span><span class="cat-name">${c.name}</span><span class="cat-count">${c.total} รายการ</span>${c.low_stock>0?`<span class="cat-warn">⚠ ใกล้หมด ${c.low_stock}</span>`:''}</button>`).join('');
}

function loadAlerts(){
  const a = getAlerts();
  const total = a.low_stock.length + a.expiring.length;
  const badge = document.getElementById('alert-badge');
  document.getElementById('alert-count').textContent = total;
  badge.style.display = total>0 ? 'block' : 'none';
  const list = document.getElementById('alert-list');
  const rows = [...a.low_stock.map(x=>`<div class="alert-item"><span>${x.name}</span><span class="a-tag">เหลือ ${x.stock}/${x.min_stock}</span></div>`),
                ...a.expiring.map(x=>`<div class="alert-item expired"><span>${x.name}</span><span class="a-tag">หมด ${x.expiry_date}</span></div>`)];
  list.innerHTML = rows.length ? rows.join('') : '<div style="font-size:11px;color:var(--muted)">ไม่มีการแจ้งเตือน ✓</div>';
}
function toggleAlerts(){document.getElementById('alert-panel').classList.toggle('open')}

async function goProducts(catId,catName,catIcon){
  currentCatId=catId;currentCatName=catName;
  document.getElementById('prod-eyebrow').textContent=catIcon+' '+catName;
  document.getElementById('prod-title').innerHTML=catName+'<span> สต๊อก</span>';
  showScreen('screen-products');loadProducts();
}

function loadProducts(){
  const prods = getProducts(currentCatId);
  const list = document.getElementById('prod-list');
  if(!prods.length){list.innerHTML='<div class="loading">ยังไม่มีสินค้า กด + เพิ่มสินค้า</div>';return}
  list.innerHTML = prods.map(p=>{
    const cls = p.is_expired?'expired':p.is_low?'low':'';
    const numCls = p.stock===0?'critical':p.is_low?'low':'';
    const expCls = p.is_expired?'bad':p.expiry_date?'warn':'ok';
    const expTxt = p.expiry_date?(p.is_expired?'❌ หมดอายุ ':'📅 ')+p.expiry_date:'—';
    return `<div class="prod-card ${cls}" onclick="openEditModal(${JSON.stringify(p).replace(/"/g,'&quot;')})"><div class="prod-name">${p.name}</div><div class="prod-meta">฿${p.price} &nbsp;<span class="prod-exp ${expCls}">${expTxt}</span></div><div class="stock-ctrl"><button class="s-btn" onclick="event.stopPropagation();changeStock(${p.id},1)">＋</button><div class="stock-num ${numCls}">${p.stock}</div><button class="s-btn" onclick="event.stopPropagation();changeStock(${p.id},-1)">－</button></div></div>`;
  }).join('');
}

async function changeStock(pid,delta){
  const p = products.find(x=>x.id===pid);
  if(!p) return;
  p.stock = Math.max(0, p.stock + delta);
  await saveData();
  loadProducts();loadAlerts();
  toast(delta>0?'＋ เพิ่มสต๊อก':'－ ลดสต๊อก');
}

function openAddModal(){
  editingProdId=null;
  document.getElementById('modal-title').textContent='+ เพิ่มสินค้า';
  document.getElementById('delete-row').style.display='none';
  ['f-name','f-stock','f-min','f-exp','f-price'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-min').value='3';document.getElementById('f-stock').value='0';
  document.getElementById('modal').classList.add('open');
}
function openEditModal(p){
  editingProdId=p.id;
  document.getElementById('modal-title').textContent='✏ แก้ไขสินค้า';
  document.getElementById('delete-row').style.display='flex';
  document.getElementById('f-name').value=p.name;
  document.getElementById('f-stock').value=p.stock;
  document.getElementById('f-min').value=p.min_stock;
  document.getElementById('f-exp').value=p.expiry_date||'';
  document.getElementById('f-price').value=p.price;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}

async function saveProduct(){
  const data = {
    name: document.getElementById('f-name').value.trim(),
    stock: parseInt(document.getElementById('f-stock').value)||0,
    min_stock: parseInt(document.getElementById('f-min').value)||3,
    expiry_date: document.getElementById('f-exp').value||null,
    price: parseFloat(document.getElementById('f-price').value)||0,
    category_id: currentCatId
  };
  if(!data.name){toast('⚠ กรุณาใส่ชื่อสินค้า');return}
  if(editingProdId){
    const idx = products.findIndex(p=>p.id===editingProdId);
    if(idx>-1) products[idx] = {...products[idx], ...data};
    toast('✓ บันทึกแล้ว');
  }else{
    data.id = nextId(products);
    products.push(data);
    toast('✓ เพิ่มสินค้าแล้ว');
  }
  await saveData();
  closeModal();loadProducts();loadAlerts();
}

async function deleteProduct(){
  if(editingProdId==null) return;
  products = products.filter(p=>p.id!==editingProdId);
  await saveData();
  closeModal();loadProducts();loadAlerts();
  toast('🗑 ลบสินค้าแล้ว');
}

async function goSummary(){
  showScreen('screen-summary');
  const cats = getCategoriesStats();
  const prods = getProducts(null);
  const box = document.getElementById('sum-content');
  let total=0;
  const cards = cats.map(c=>{
    const cp = prods.filter(p=>p.category_id===c.id);
    const t = cp.reduce((s,p)=>s+p.stock,0);
    total+=t;
    return `<div class="sum-card"><div class="sum-cat">${c.icon} ${c.name}</div>${cp.map(p=>`<div class="sum-row"><span>${p.name}</span><span style="color:${p.stock<=p.min_stock?'var(--amber)':'var(--text)'}">${p.stock} ชิ้น</span></div>`).join('')}<div class="sum-row total-row"><span>รวม</span><span>${t} ชิ้น</span></div></div>`;
  }).join('');
  box.innerHTML = `<div class="sum-total-box"><div class="sum-total-lbl">สต๊อกทั้งหมด</div><div class="sum-total-num">${total}</div><div style="font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:2px">รายการ</div></div>${cards}`;
}

/* ===== Manual backup / restore (works with or without persistent storage) ===== */
function exportData(){
  const blob = new Blob([JSON.stringify({categories,products},null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vending-stock-backup.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('⭳ สำรองข้อมูลแล้ว');
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(d.categories) categories = d.categories;
      if(d.products) products = d.products;
      await saveData();
      goHome();
      toast('⭱ นำเข้าข้อมูลแล้ว');
    }catch(e){ toast('⚠ ไฟล์ไม่ถูกต้อง'); }
  };
  reader.readAsText(file);
  evt.target.value='';
}

(async()=>{ await loadData(); goHome(); })();
</script>
